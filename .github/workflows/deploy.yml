name: Deploy AstroBitPlays to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ github.event_name != 'schedule' || steps.content.outputs.changed == 'true' }}
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compare published content
        id: content
        if: github.event_name == 'schedule'
        run: npx tsx --tsconfig tsconfig.test.json scripts/check-content.ts

      - name: Check source and publishing rules
        if: github.event_name != 'schedule' || steps.content.outputs.changed == 'true'
        run: npm run lint && npm test

      - name: Build production bundle
        if: github.event_name != 'schedule' || steps.content.outputs.changed == 'true'
        run: npm run build

      - name: Upload artifact
        if: github.event_name != 'schedule' || steps.content.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

  deploy:
    if: needs.build.outputs.deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
