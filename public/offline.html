<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1b2c" />
    <title>You’re offline | AstroBitPlays</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #f5f7f9; color: #172536; font: 16px/1.6 system-ui, sans-serif; }
      main { width: min(100%, 560px); padding: 36px; border: 1px solid #dce2e9; border-radius: 12px; background: #fff; box-shadow: 0 16px 48px #0b1b2c12; }
      a { color: #007a9e; font-weight: 700; }
      .brand { margin: 0 0 28px; color: #0b1b2c; font-size: 17px; font-weight: 850; letter-spacing: -.3px; }
      .brand b { color: #007a9e; }
      h1 { margin: 0 0 10px; color: #0b1b2c; font-size: 30px; line-height: 1.2; }
      p { margin: 0 0 20px; color: #526176; }
      @media (max-width: 520px) { main { padding: 26px 22px; } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">ASTROBIT<b>PLAYS</b></p>
      <h1>You’re offline</h1>
      <p>This page hasn’t been saved on this device yet. Reconnect to browse the latest stories, or reopen a page you’ve visited before.</p>
      <a href="/">Try the homepage</a>
    </main>
  </body>
</html>
